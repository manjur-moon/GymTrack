services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gymtrack
      POSTGRES_PASSWORD: gymtrack
      POSTGRES_DB: gymtrack
    ports:
      - "5432:5432"
    volumes:
      - gymtrack_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gymtrack -d gymtrack"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  gymtrack_pgdata:
